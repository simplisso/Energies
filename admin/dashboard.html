<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord | Admin SIMEL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #F0F2F5; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 280px; padding: 30px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #loader-overlay { position: fixed; inset: 0; background: #2D3748; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
        .btn-logout { color: #FC8181; cursor: pointer; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div id="loader-status">Vérification de la session...</div>
    </div>

    <nav class="sidebar">
        <h2>SIMEL Admin</h2>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <ul style="list-style: none; padding: 0;">
            <li><a href="dashboard.html" style="color:white; display:block; padding:10px 0;">Dashboard</a></li>
            <li><a href="annonces-list.html" style="color:#A0AEC0; display:block; padding:10px 0;">Expertises</a></li>
            <li><a href="leads.html" style="color:#A0AEC0; display:block; padding:10px 0;">Demandes</a></li>
            <li><a href="agents.html" style="color:#A0AEC0; display:block; padding:10px 0;">Agents</a></li>
        </ul>
        <a id="logoutBtn" class="btn-logout">Déconnexion</a>
    </nav>

    <main class="main">
        <h1>Tableau de Bord</h1>
        <div class="card">
            <p>Bienvenue dans votre espace de gestion.</p>
            <div id="stats">Chargement des données...</div>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://VOTRE_PROJET.supabase.co', 'VOTRE_CLE_ANON');

        async function checkAccess() {
            // On attend 1 seconde pour laisser le temps à GitHub/Edge de charger le cookie
            await new Promise(res => setTimeout(res, 1000));
            
            const { data: { session } } = await _supabase.auth.getSession();

            if (!session) {
                document.getElementById('loader-status').innerHTML = `
                    <p>Session non détectée.</p>
                    <a href="login.html" style="color:white; background:#E53E3E; padding:10px; border-radius:5px; text-decoration:none;">Se connecter</a>
                `;
            } else {
                document.getElementById('loader-overlay').style.display = 'none';
                console.log("Connecté :", session.user.email);
            }
        }

        document.getElementById('logoutBtn').onclick = async () => {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        };

        window.onload = checkAccess;
    </script>
</body>
</html>
