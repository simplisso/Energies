<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Demandes | Admin SIMEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2d3748; --accent: #E53E3E; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        
        .lead-card { 
            background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px;
            display: grid; grid-template-columns: 1fr 2fr 150px; gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-items: center;
            border-left: 5px solid var(--accent);
        }
        .lead-info h3 { margin: 0 0 10px 0; color: var(--primary); }
        .lead-info p { margin: 5px 0; font-size: 0.9rem; color: #666; }
        .lead-info i { color: var(--accent); width: 20px; }
        
        .lead-content strong { display: block; color: var(--accent); margin-bottom: 5px; }
        .lead-content p { font-style: italic; color: #4a5568; margin: 0; }
        .lead-content small { color: #a0aec0; display: block; margin-top: 10px; }

        .lead-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-call { 
            background: #3182ce; color: white; text-decoration: none; text-align: center;
            padding: 8px; border-radius: 5px; font-weight: bold; font-size: 0.85rem;
        }
        .btn-delete { 
            background: #fff; color: var(--accent); border: 1px solid var(--accent);
            padding: 8px; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .btn-delete:hover { background: var(--accent); color: white; }

        @media (max-width: 768px) {
            .lead-card { grid-template-columns: 1fr; }
            .lead-actions { flex-direction: row; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Demandes de Contact</h1>
        <div id="leads-container">
            <p style="text-align: center; padding: 50px;"><i class="fas fa-spinner fa-spin"></i> Chargement des messages...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadLeads() {
            const container = document.getElementById('leads-container');
            
            const { data, error } = await _supabase
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color:red">Erreur : ${error.message}</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = `<p style="text-align:center">Aucun message reçu pour le moment.</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(lead => {
                // IMPORTANT : On vérifie les noms exacts des colonnes pour l'affichage
                container.innerHTML += `
                    <div class="lead-card">
                        <div class="lead-info">
                            <h3>${lead.client_name || 'Anonyme'}</h3>
                            <p><i class="fas fa-phone"></i> ${lead.client_phone || 'Non renseigné'}</p>
                            <p><i class="fas fa-envelope"></i> ${lead.client_email || 'Non renseigné'}</p>
                        </div>
                        <div class="lead-content">
                            <strong>Sujet : ${lead.subject || 'Général'}</strong>
                            <p>"${lead.message || 'Pas de message'}"</p>
                            <small>Reçu le : ${new Date(lead.created_at).toLocaleString('fr-FR')}</small>
                        </div>
                        <div class="lead-actions">
                            <a href="tel:${lead.client_phone}" class="btn-call"><i class="fas fa-phone"></i> Appeler</a>
                            <button onclick="deleteLead('${lead.id}')" class="btn-delete">
                                <i class="fas fa-trash"></i> Supprimer
                            </button>
                        </div>
                    </div>`;
            });
        }

        async function deleteLead(id) {
            if (confirm("Voulez-vous vraiment supprimer ce message ?")) {
                const { error } = await _supabase
                    .from('leads')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Erreur de suppression : " + error.message);
                } else {
                    loadLeads(); // On rafraîchit la liste après suppression
                }
            }
        }

        window.onload = loadLeads;
    </script>
</body>
</html>
