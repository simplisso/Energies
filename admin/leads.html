<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Demandes | Admin SIMEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2d3748; --accent: #E53E3E; --blue: #3182ce; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        h1 { color: var(--primary); border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-bottom: 30px; }
        
        .leads-grid { display: grid; gap: 20px; }
        
        .lead-card { 
            background: white; border-radius: 12px; padding: 25px;
            display: grid; grid-template-columns: 250px 1fr 180px; gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); align-items: center;
            border-left: 6px solid var(--accent);
        }

        .lead-info h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.2rem; }
        .lead-info p { margin: 6px 0; font-size: 0.9rem; color: #4a5568; display: flex; align-items: center; gap: 8px; }
        .lead-info i { color: var(--accent); width: 16px; }

        .lead-content strong { display: block; color: var(--accent); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 8px; }
        .lead-content p { font-style: italic; color: #2d3748; margin: 0; line-height: 1.5; }
        .lead-content small { color: #a0aec0; display: block; margin-top: 15px; font-size: 0.8rem; }

        .lead-actions { display: flex; flex-direction: column; gap: 12px; }

        /* Bouton Appeler (Lien cliquable) */
        .btn-call { 
            background: var(--blue); color: white !important; text-decoration: none; 
            text-align: center; padding: 10px; border-radius: 6px; font-weight: bold; 
            font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; border: none; cursor: pointer;
        }
        .btn-call:hover { background: #2c5282; transform: translateY(-2px); }
        .btn-call.disabled { background: #cbd5e0; cursor: not-allowed; pointer-events: none; }

        /* Bouton Supprimer */
        .btn-delete { 
            background: #fff; color: var(--accent); border: 1px solid var(--accent);
            padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s;
            font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-delete:hover { background: var(--accent); color: white; }

        @media (max-width: 900px) {
            .lead-card { grid-template-columns: 1fr; gap: 15px; }
            .lead-actions { flex-direction: row; }
            .lead-actions > * { flex: 1; }
        }
    </style>
</head>
<body>
  <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-bolt" style="color:#E53E3E"></i> SIMEL Admin</h2></div>
            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="annonces-list.html" class="active"><i class="fas fa-list"></i> Nos Services</a>
                <a href="realisations-list.html"><i class="fas fa-images"></i> Nos Réalisations</a>
                <a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a>
                <a href="team-list.html"><i class="fas fa-users"></i> Équipe</a>
                <a href="agents.html"><i class="fas fa-users"></i> Agents</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Réglages</a>
            </nav>
        </aside>
  </div>
    <div class="container">
        <h1><i class="fas fa-envelope-open-text"></i> Demandes de Contact</h1>
        <div id="leads-container" class="leads-grid">
            <p style="text-align: center; padding: 50px;"><i class="fas fa-spinner fa-spin"></i> Chargement des messages...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadLeads() {
            const container = document.getElementById('leads-container');
            
            const { data, error } = await _supabase
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color:red; text-align:center;">Erreur : ${error.message}</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding: 40px; color: #718096;">Aucune demande reçue pour le moment.</p>`;
                return;
            }

            container.innerHTML = '';
            data.forEach(lead => {
                // Nettoyage du numéro pour le lien tel:
                const rawPhone = lead.client_phone || '';
                const cleanPhone = rawPhone.replace(/\s+/g, ''); // Enlève les espaces

                // Construction du bouton d'appel
                const callAction = cleanPhone 
                    ? `<a href="tel:${cleanPhone}" class="btn-call"><i class="fas fa-phone"></i> Appeler</a>`
                    : `<button class="btn-call disabled"><i class="fas fa-phone-slash"></i> Non renseigné</button>`;

                container.innerHTML += `
                    <div class="lead-card">
                        <div class="lead-info">
                            <h3>${lead.client_name || 'Anonyme'}</h3>
                            <p><i class="fas fa-phone"></i> ${rawPhone || 'Non renseigné'}</p>
                            <p><i class="fas fa-envelope"></i> ${lead.client_email || 'Non renseigné'}</p>
                        </div>
                        <div class="lead-content">
                            <strong>Sujet : ${lead.subject || 'Demande Générale'}</strong>
                            <p>"${lead.message || 'Aucun message'}"</p>
                            <small>Reçu le : ${new Date(lead.created_at).toLocaleString('fr-FR')}</small>
                        </div>
                        <div class="lead-actions">
                            ${callAction}
                            <button onclick="deleteLead('${lead.id}')" class="btn-delete">
                                <i class="fas fa-trash"></i> Supprimer
                            </button>
                        </div>
                    </div>`;
            });
        }

        async function deleteLead(id) {
            if (confirm("Voulez-vous vraiment supprimer définitivement ce message ?")) {
                const { error } = await _supabase
                    .from('leads')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Erreur lors de la suppression : " + error.message);
                } else {
                    loadLeads(); // Rafraîchissement automatique après suppression
                }
            }
        }

        // Chargement initial
        window.onload = loadLeads;
    </script>
</body>
</html>
