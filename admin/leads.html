<!DOCTYPE html>
<html lang="fr" data-admin-page>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Demandes | Admin SIMEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #2d3748; 
            --accent: #E53E3E; 
            --blue: #3182ce; 
            --bg: #E2E8F0; 
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg); 
            color: #2D3748; 
        }

        .admin-layout { display: flex; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { 
            width: 250px; 
            background: #2D3748; 
            color: white; 
            position: fixed; 
            height: 100vh; 
            padding: 20px 0; 
        }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-menu a { display: block; padding: 12px 20px; color: #A0AEC0; text-decoration: none; transition: 0.3s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { 
            color: white; 
            background: rgba(255,255,255,0.05); 
            border-left: 4px solid var(--accent); 
        }

        /* MAIN CONTENT AREA */
        .main-content { 
            flex: 1; 
            margin-left: 250px; 
            padding: 40px; 
            width: calc(100% - 250px);
        }

        .container { max-width: 1100px; margin: 0 auto; }
        
        h1 { 
            color: var(--primary); 
            border-bottom: 3px solid var(--accent); 
            padding-bottom: 10px; 
            margin-bottom: 30px; 
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* LEADS STYLES */
        .leads-grid { display: grid; gap: 20px; }
        
        .lead-card { 
            background: white; 
            border-radius: 12px; 
            padding: 25px;
            display: grid; 
            grid-template-columns: 250px 1fr 180px; 
            gap: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            align-items: center;
            border-left: 6px solid var(--accent);
        }

        .lead-info h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.1rem; }
        .lead-info p { margin: 6px 0; font-size: 0.85rem; color: #4a5568; display: flex; align-items: center; gap: 8px; }
        .lead-info i { color: var(--accent); width: 16px; }

        .lead-content strong { display: block; color: var(--accent); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; margin-bottom: 8px; }
        .lead-content p { font-style: italic; color: #2d3748; margin: 0; line-height: 1.5; font-size: 0.9rem; }
        .lead-content small { color: #a0aec0; display: block; margin-top: 15px; font-size: 0.75rem; }

        .lead-actions { display: flex; flex-direction: column; gap: 12px; }

        .lead-filters { display: flex; gap: 12px; margin: 0 0 8px; }
        .lead-filters input, .lead-filters select, .lead-status {
            min-height: 42px;
            padding: 9px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            background: #fff;
            color: #2d3748;
            font: inherit;
        }
        .lead-filters input { flex: 1; min-width: 0; }
        .lead-status { width: 100%; }
        .lead-count { margin: 0 0 16px; color: #718096; font-size: 0.9rem; }
        .lead-empty { padding: 36px 20px; color: #718096; text-align: center; }

        .btn-call { 
            background: var(--blue); color: white !important; text-decoration: none; 
            text-align: center; padding: 10px; border-radius: 6px; font-weight: bold; 
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; border: none;
        }
        .btn-call:hover { background: #2c5282; transform: translateY(-2px); }
        .btn-call.disabled { background: #cbd5e0; cursor: not-allowed; pointer-events: none; }

        .btn-delete { 
            background: #fff; color: var(--accent); border: 1px solid var(--accent);
            padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s;
            font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.85rem;
        }
        .btn-delete:hover { background: var(--accent); color: white; }

        @media (max-width: 1024px) {
            .lead-card { grid-template-columns: 1fr; gap: 15px; }
            .lead-actions { flex-direction: row; }
        }
        @media (max-width: 560px) {
            .lead-filters { flex-direction: column; }
            .lead-actions { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-bolt" style="color:#E53E3E"></i> SIMEL Admin</h2>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="annonces-list.html"><i class="fas fa-list"></i> Nos Services</a>
                <a href="realisations-list.html"><i class="fas fa-images"></i> Nos Réalisations</a>
                <a href="leads.html" class="active"><i class="fas fa-envelope"></i> Demandes</a>
                <a href="team-list.html"><i class="fas fa-users"></i> Équipe</a>
                <a href="agents.html"><i class="fas fa-user-tie"></i> Agents</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Réglages</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="container">
                <h1><i class="fas fa-envelope-open-text"></i> Demandes de Contact</h1>
                <div class="lead-filters">
                    <input id="lead-search" type="search" placeholder="Rechercher un nom, e-mail, sujet…" aria-label="Rechercher une demande">
                    <select id="lead-status-filter" aria-label="Filtrer par statut">
                        <option value="">Tous les statuts</option>
                        <option value="nouvelle">Nouvelle</option>
                        <option value="contactée">Contactée</option>
                        <option value="terminée">Terminée</option>
                    </select>
                </div>
                <p id="lead-count" class="lead-count" role="status"></p>
                <div id="leads-container" class="leads-grid">
                    <p style="text-align: center; padding: 50px;"><i class="fas fa-spinner fa-spin"></i> Chargement des messages...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = window.adminSupabase;

        const leadStatuses = {
            nouvelle: 'Nouvelle',
            'contactée': 'Contactée',
            'terminée': 'Terminée'
        };
        let allLeads = [];

        function normalizeLeadStatus(status) {
            return status === 'nouveau' || !Object.hasOwn(leadStatuses, status) ? 'nouvelle' : status;
        }

        function renderLeads() {
            const container = document.getElementById('leads-container');
            const query = document.getElementById('lead-search').value.trim().toLocaleLowerCase('fr');
            const selectedStatus = document.getElementById('lead-status-filter').value;
            const filteredLeads = allLeads.filter(lead => {
                const status = normalizeLeadStatus(lead.status);
                const searchableText = [lead.client_name, lead.client_email, lead.client_phone, lead.subject, lead.message]
                    .filter(Boolean)
                    .join(' ')
                    .toLocaleLowerCase('fr');
                return (!selectedStatus || status === selectedStatus) && searchableText.includes(query);
            });

            document.getElementById('lead-count').textContent = `${filteredLeads.length} demande${filteredLeads.length === 1 ? '' : 's'} sur ${allLeads.length}`;
            container.replaceChildren();

            if (filteredLeads.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'lead-empty';
                empty.textContent = allLeads.length ? 'Aucune demande ne correspond aux filtres.' : 'Aucune demande reçue pour le moment.';
                container.appendChild(empty);
                return;
            }

            filteredLeads.forEach(lead => {
                const card = document.createElement('article');
                card.className = 'lead-card';

                const info = document.createElement('div');
                info.className = 'lead-info';
                const name = document.createElement('h3');
                name.textContent = lead.client_name || 'Anonyme';
                const phone = document.createElement('p');
                phone.textContent = `Téléphone : ${lead.client_phone || 'Non renseigné'}`;
                const email = document.createElement('p');
                email.textContent = `E-mail : ${lead.client_email || 'Non renseigné'}`;
                info.append(name, phone, email);

                const content = document.createElement('div');
                content.className = 'lead-content';
                const subject = document.createElement('strong');
                subject.textContent = `Sujet : ${lead.subject || 'Demande générale'}`;
                const message = document.createElement('p');
                message.textContent = lead.message || 'Aucun message';
                const received = document.createElement('small');
                received.textContent = `Reçue le : ${new Date(lead.created_at).toLocaleString('fr-FR')}`;
                content.append(subject, message, received);

                const actions = document.createElement('div');
                actions.className = 'lead-actions';
                const cleanPhone = (lead.client_phone || '').replace(/[^\d+]/g, '');
                if (cleanPhone) {
                    const call = document.createElement('a');
                    call.className = 'btn-call';
                    call.href = `tel:${cleanPhone}`;
                    call.textContent = 'Appeler';
                    actions.appendChild(call);
                }

                const status = document.createElement('select');
                status.className = 'lead-status';
                status.dataset.leadStatus = lead.id;
                status.setAttribute('aria-label', `Statut de ${lead.client_name || 'la demande'}`);
                Object.entries(leadStatuses).forEach(([value, label]) => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = label;
                    option.selected = normalizeLeadStatus(lead.status) === value;
                    status.appendChild(option);
                });
                actions.appendChild(status);

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'btn-delete';
                deleteButton.dataset.deleteLead = lead.id;
                deleteButton.textContent = 'Supprimer';
                actions.appendChild(deleteButton);

                card.append(info, content, actions);
                container.appendChild(card);
            });
        }

        async function loadLeads() {
            const container = document.getElementById('leads-container');
            const { data, error } = await _supabase
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.textContent = 'Impossible de charger les demandes.';
                console.error('Erreur de chargement des demandes:', error);
                return;
            }

            allLeads = data || [];
            renderLeads();
        }

        async function updateLeadStatus(id, status) {
            if (!Object.hasOwn(leadStatuses, status)) return;

            const { error } = await _supabase
                .from('leads')
                .update({ status })
                .eq('id', id);

            if (error) {
                alert('Impossible de mettre à jour le statut.');
                console.error('Erreur de mise à jour du statut:', error);
                return;
            }

            allLeads = allLeads.map(lead => String(lead.id) === id ? { ...lead, status } : lead);
            renderLeads();
        }

        async function deleteLead(id) {
            if (!confirm('Voulez-vous vraiment supprimer définitivement cette demande ?')) return;

            const { error } = await _supabase
                .from('leads')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Impossible de supprimer cette demande.');
                console.error('Erreur de suppression:', error);
                return;
            }

            allLeads = allLeads.filter(lead => String(lead.id) !== id);
            renderLeads();
        }

        document.getElementById('lead-search').addEventListener('input', renderLeads);
        document.getElementById('lead-status-filter').addEventListener('change', renderLeads);
        document.getElementById('leads-container').addEventListener('change', event => {
            const select = event.target.closest('[data-lead-status]');
            if (select) updateLeadStatus(select.dataset.leadStatus, select.value);
        });
        document.getElementById('leads-container').addEventListener('click', event => {
            const button = event.target.closest('[data-delete-lead]');
            if (button) deleteLead(button.dataset.deleteLead);
        });

        window.onload = async () => {
            if (await window.adminReady) loadLeads();
        };
    </script>
</body>
</html>
