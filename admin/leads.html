<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Demandes Clients | Admin SIMEL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #F0F2F5; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 280px; padding: 30px; width: calc(100% - 280px); }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #718096; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #EBF8FF; color: #2B6CB0; }
        #loader { position: fixed; inset: 0; background: #2D3748; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body>

    <div id="loader">Vérification de la session...</div>

    <nav class="sidebar">
        <h2>SIMEL Admin</h2>
        <ul style="list-style: none; padding: 0; margin-top: 30px;">
            <li><a href="dashboard.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Dashboard</a></li>
            <li><a href="annonces-list.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Expertises</a></li>
            <li><a href="leads.html" style="color:white; text-decoration: none; display:block; padding:10px 0;"><b>Demandes</b></a></li>
            <li><a href="agents.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Agents</a></li>
        </ul>
    </nav>

    <main class="main">
        <h1>Demandes de contact (Leads)</h1>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Client</th>
                        <th>Sujet</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="leads-table">
                    <tr><td colspan="4">Chargement des messages...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://VOTRE_PROJET.supabase.co', 'VOTRE_CLE_ANON');

        async function initLeads() {
            // 1. Vérification Session
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
                return;
            }
            document.getElementById('loader').style.display = 'none';

            // 2. Chargement des données
            const { data: leads, error } = await _supabase
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            const table = document.getElementById('leads-table');
            if (error) {
                table.innerHTML = `<tr><td colspan="4">Erreur: ${error.message}</td></tr>`;
                return;
            }

            table.innerHTML = leads.map(l => `
                <tr>
                    <td>${new Date(l.created_at).toLocaleDateString()}</td>
                    <td><b>${l.client_name}</b><br><small>${l.client_email}</small></td>
                    <td><span class="status">${l.subject}</span></td>
                    <td style="font-size: 0.9rem;">${l.message}</td>
                </tr>
            `).join('');
        }

        window.onload = initLeads;
    </script>
</body>
</html>
