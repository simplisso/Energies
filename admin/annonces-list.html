<div class="settings-container">
    <h2><i class="fas fa-tools"></i> Ajouter un Service ou Chantier</h2>
    <form id="serviceForm" style="margin-top: 20px;">
        <div class="form-group">
            <label>Titre du projet / Service</label>
            <input type="text" id="serviceTitle" placeholder="Ex: Installation Solaire 5KW à Cotonou" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="serviceDesc" rows="3" placeholder="Détails du chantier..."></textarea>
        </div>
        <div class="form-group">
            <label>Photo du chantier</label>
            <input type="file" id="serviceImg" accept="image/*" required>
        </div>
        <button type="submit" id="addBtn" class="btn-save" style="background: #3182CE;">
            <i class="fas fa-plus"></i> Publier sur le site
        </button>
    </form>
</div>

<script>
    const _supabase = supabase.createClient('VOTRE_URL', 'VOTRE_KEY');

    document.getElementById('serviceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('addBtn');
        const file = document.getElementById('serviceImg').files[0];
        btn.disabled = true;

        // 1. Upload de l'image dans le Storage
        const fileName = `${Date.now()}_${file.name}`;
        const { data: imgData, error: imgError } = await _supabase.storage
            .from('services-images')
            .upload(fileName, file);

        if (imgError) return alert("Erreur image: " + imgError.message);

        // 2. Récupérer l'URL publique de l'image
        const { data: { publicUrl } } = _supabase.storage
            .from('services-images')
            .getPublicUrl(fileName);

        // 3. Enregistrer les infos dans la table
        const { error } = await _supabase.from('portfolio_services').insert([{
            title: document.getElementById('serviceTitle').value,
            description: document.getElementById('serviceDesc').value,
            image_url: publicUrl
        }]);

        if (error) alert(error.message);
        else {
            alert("Chantier ajouté avec succès !");
            location.reload();
        }
    });
</script>
