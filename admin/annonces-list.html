<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Annonces | Admin SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* CSS GLOBAL ADMIN (Intégré pour garantir l'affichage) */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; line-height: 1.6; color: #4A4A4A; background-color: #E2E8F0; }
        a { text-decoration: none; transition: 0.3s; }
        .admin-layout { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 250px; background-color: #2D3748; color: white; padding: 20px 0; position: fixed; height: 100vh; }
        .sidebar-header { padding: 0 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; text-align: center; }
        .sidebar-menu li a { display: block; padding: 12px 20px; color: #A0AEC0; border-left: 4px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255,255,255,0.05); color: white; border-left-color: #E53E3E; }

        /* CONTENT */
        .main-content { flex: 1; margin-left: 250px; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-add { background: #E53E3E; color: white; padding: 10px 20px; border-radius: 5px; font-weight: 600; }

        /* TABLE */
        .white-box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th { text-align: left; padding: 12px; border-bottom: 2px solid #E2E8F0; color: #718096; }
        .admin-table td { padding: 15px 12px; border-bottom: 1px solid #EDF2F7; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-active { background: #C6F6D5; color: #2F855A; }
        
        .btn-edit { color: #3182CE; margin-right: 10px; font-size: 1.1rem; }
        .btn-delete { color: #E53E3E; border: none; background: none; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>SIMEL Admin</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="annonces-list.html" class="active"><i class="fas fa-list"></i> Expertises</a></li>
                <li><a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a></li>
                <li><a href="agents.html"><i class="fas fa-users"></i> Équipe</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Réglages</a></li>
                <li><a href="#" id="logoutBtn" style="color: #FC8181; margin-top: 50px;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1>Nos Expertises / Services</h1>
                <a href="annonces-new.html" class="btn-add"><i class="fas fa-plus"></i> Nouveau Service</a>
            </div>

            <div class="white-box">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Titre du Service</th>
                            <th>Description</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="servicesList">
                        <tr><td colspan="5">Chargement des expertises...</td></tr>
                    </tbody>
                </table>
            </div>

            <footer style="margin-top: 40px; opacity: 0.6; font-size: 0.85rem; text-align: center;">
                &copy; 2025 SIMEL S.E.S - Gestion du catalogue de services.
            </footer>
        </main>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const _supabase = supabase.createClient('https://VOTRE_PROJET.supabase.co', 'VOTRE_CLE_ANON');

        // 1. Vérifier si l'utilisateur est connecté
        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) window.location.href = 'login.html';
        }

        // 2. Charger les services (portfolio)
        async function loadServices() {
            const { data: services, error } = await _supabase
                .from('portfolio_services')
                .select('*')
                .order('id', { ascending: true });

            const tbody = document.getElementById('servicesList');

            if (error) {
                tbody.innerHTML = "<tr><td colspan='5'>Erreur de chargement.</td></tr>";
                return;
            }

            if (services.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>Aucun service configuré.</td></tr>";
                return;
            }

            tbody.innerHTML = services.map(s => `
                <tr>
                    <td><img src="${s.image_url}" class="img-preview" alt="Icone"></td>
                    <td><strong>${s.title}</strong></td>
                    <td>${s.description.substring(0, 50)}...</td>
                    <td><span class="badge badge-active">En ligne</span></td>
                    <td>
                        <button onclick="deleteService(${s.id})" class="btn-delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // 3. Supprimer un service
        async function deleteService(id) {
            if (confirm("Voulez-vous vraiment supprimer ce service du site public ?")) {
                const { error } = await _supabase.from('portfolio_services').delete().eq('id', id);
                if (!error) loadServices();
                else alert("Erreur lors de la suppression.");
            }
        }

        // 4. Déconnexion
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Initialisation
        window.onload = () => {
            checkAuth();
            loadServices();
        };
    </script>
</body>
</html>
