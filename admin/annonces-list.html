<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Expertises | Admin SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* CSS ADMIN INTÉGRÉ */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #E2E8F0; color: #4A4A4A; }
        
        .admin-layout { display: flex; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: 250px; background: #2D3748; color: white; position: fixed; height: 100vh; padding: 20px 0; }
        .sidebar-header { padding: 0 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-menu li a { display: block; padding: 12px 20px; color: #A0AEC0; text-decoration: none; border-left: 4px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: rgba(255,255,255,0.05); color: white; border-left-color: #E53E3E; }

        /* MAIN CONTENT */
        .main-content { flex: 1; margin-left: 250px; padding: 30px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-add { background: #E53E3E; color: white; padding: 10px 20px; border-radius: 5px; font-weight: 600; text-decoration: none; }

        .white-box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th { text-align: left; padding: 12px; border-bottom: 2px solid #E2E8F0; color: #718096; }
        .admin-table td { padding: 15px 12px; border-bottom: 1px solid #EDF2F7; }
        
        .img-preview { width: 60px; height: 45px; object-fit: cover; border-radius: 4px; background: #eee; }
        .btn-delete { color: #E53E3E; background: none; border: none; cursor: pointer; font-size: 1.1rem; }
        
        /* Loader pour éviter le flash blanc */
        #page-loader { position: fixed; inset: 0; background: #2D3748; display: flex; justify-content: center; align-items: center; color: white; z-index: 9999; }
    </style>
</head>
<body>

    <div id="page-loader">Authentification en cours...</div>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>SIMEL Admin</h2></div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                <li><a href="annonces-list.html" class="active"><i class="fas fa-list"></i> Expertises</a></li>
                <li><a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a></li>
                <li><a href="agents.html"><i class="fas fa-users"></i> Équipe</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Réglages</a></li>
                <li><a href="#" id="logoutBtn" style="color: #FC8181; margin-top: 40px; display: block; padding: 20px;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1>Catalogue des Expertises</h1>
                <a href="#" class="btn-add" onclick="alert('Fonctionnalité d\'ajout bientôt disponible')"><i class="fas fa-plus"></i> Ajouter</a>
            </div>

            <div class="white-box">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Aperçu</th>
                            <th>Titre du Service</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="servicesList">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // 1. CONFIGURATION (METTEZ VOS CLÉS ICI)
        const SUPABASE_URL = 'https://VOTRE_PROJET.supabase.co';
        const SUPABASE_KEY = 'VOTRE_CLE_ANON_PUBLIC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. VÉRIFICATION DE LA SESSION ET CHARGEMENT
        async function checkSession() {
            const { data: { session }, error } = await _supabase.auth.getSession();

            if (error || !session) {
                console.log("Session invalide, redirection login...");
                window.location.href = 'login.html';
            } else {
                // Si connecté, on enlève le loader et on charge les données
                document.getElementById('page-loader').style.display = 'none';
                loadExpertises();
            }
        }

        // 3. CHARGER LES SERVICES DEPUIS LA TABLE portfolio_services
        async function loadExpertises() {
            const tbody = document.getElementById('servicesList');
            tbody.innerHTML = "<tr><td colspan='4'>Chargement des données...</td></tr>";

            const { data: services, error } = await _supabase
                .from('portfolio_services')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan='4'>Erreur : ${error.message}</td></tr>`;
                return;
            }

            if (services.length === 0) {
                tbody.innerHTML = "<tr><td colspan='4'>Aucune expertise enregistrée.</td></tr>";
                return;
            }

            tbody.innerHTML = services.map(s => `
                <tr>
                    <td><img src="${s.image_url}" class="img-preview" onerror="this.src='https://via.placeholder.com/60x45?text=SIMEL'"></td>
                    <td><strong>${s.title}</strong></td>
                    <td><div style="max-width:350px; font-size:0.85rem; color:#718096">${s.description}</div></td>
                    <td>
                        <button onclick="deleteService(${s.id})" class="btn-delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        // 4. SUPPRESSION
        async function deleteService(id) {
            if (confirm("Supprimer ce service du site public ?")) {
                const { error } = await _supabase.from('portfolio_services').delete().eq('id', id);
                if (!error) loadExpertises();
                else alert("Erreur lors de la suppression.");
            }
        }

        // 5. LOGOUT
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Lancement au démarrage
        window.onload = checkSession;
    </script>
</body>
</html>
