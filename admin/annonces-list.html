<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Expertises | SIMEL Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #F0F2F5; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 280px; padding: 30px; width: calc(100% - 280px); }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #718096; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .img-preview { width: 60px; height: 40px; border-radius: 4px; object-fit: cover; background: #eee; }
        .btn-delete { background: none; border: none; color: #E53E3E; cursor: pointer; font-size: 1.1rem; }
        .btn-add { background: #38A169; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; }
        
        #loader { position: fixed; inset: 0; background: #2D3748; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    </style>
</head>
<body>

    <div id="loader">Chargement des expertises...</div>

    <nav class="sidebar">
        <h2>SIMEL Admin</h2>
        <ul style="list-style: none; padding: 0; margin-top: 30px;">
            <li><a href="dashboard.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Dashboard</a></li>
            <li><a href="annonces-list.html" style="color:white; text-decoration: none; display:block; padding:10px 0;"><b>Expertises</b></a></li>
            <li><a href="leads.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Demandes</a></li>
            <li><a href="agents.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Agents</a></li>
        </ul>
    </nav>

    <main class="main">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Nos Expertises / Services</h1>
            <a href="add-expertise.html" class="btn-add"><i class="fas fa-plus"></i> Nouveau Service</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Titre du Service</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="services-table">
                    <tr><td colspan="4">Connexion à la base de données...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // --- CONFIGURATION (Vérifie bien tes clés) ---
        const _supabase = supabase.createClient('https://VOTRE_PROJET.supabase.co', 'VOTRE_CLE_ANON');

        async function initPage() {
            // 1. Vérification de la session
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
                return;
            }
            document.getElementById('loader').style.display = 'none';

            // 2. Récupération des données
            // IMPORTANT: Vérifie si ta table s'appelle 'portfolio_services' ou 'annonces'
            const { data: services, error } = await _supabase
                .from('portfolio_services') 
                .select('*')
                .order('created_at', { ascending: false });

            const tableBody = document.getElementById('services-table');

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="4" style="color:red;">Erreur: ${error.message}</td></tr>`;
                return;
            }

            if (services.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4">Aucun service trouvé. Cliquez sur "Nouveau Service".</td></tr>`;
                return;
            }

            // 3. Affichage des lignes
            tableBody.innerHTML = services.map(s => `
                <tr>
                    <td><img src="${s.image_url || 'https://via.placeholder.com/60'}" class="img-preview"></td>
                    <td><b>${s.title}</b></td>
                    <td style="font-size: 0.85rem; color: #718096; max-width: 300px;">
                        ${s.description ? s.description.substring(0, 80) + '...' : 'Pas de description'}
                    </td>
                    <td>
                        <button onclick="deleteService('${s.id}')" class="btn-delete">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Fonction de suppression
        async function deleteService(id) {
            if (confirm("Supprimer définitivement ce service ?")) {
                const { error } = await _supabase.from('portfolio_services').delete().eq('id', id);
                if (error) alert("Erreur: " + error.message);
                else location.reload();
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
