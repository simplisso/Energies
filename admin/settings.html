<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Réglages du site | Admin SIMEL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #F0F2F5; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 280px; padding: 30px; width: calc(100% - 280px); }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4A5568; }
        input { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: #3182CE; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        #loader { position: fixed; inset: 0; background: #2D3748; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .success-msg { color: #38A169; margin-top: 15px; display: none; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

    <div id="loader">Chargement des réglages...</div>

    <nav class="sidebar">
        <h2>SIMEL Admin</h2>
        <ul style="list-style: none; padding: 0; margin-top: 30px;">
            <li><a href="dashboard.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Dashboard</a></li>
            <li><a href="annonces-list.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Expertises</a></li>
            <li><a href="leads.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Demandes</a></li>
            <li><a href="settings.html" style="color:white; text-decoration: none; display:block; padding:10px 0;"><b>Réglages</b></a></li>
        </ul>
    </nav>

    <main class="main">
        <h1>Paramètres Généraux</h1>
        <div class="card">
            <form id="settingsForm">
                <div class="form-group">
                    <label>Nom de l'entreprise</label>
                    <input type="text" id="site_name" placeholder="SIMEL S.E.S">
                </div>
                <div class="form-group">
                    <label>Email de contact</label>
                    <input type="email" id="contact_email" placeholder="contact@simel-ses.com">
                </div>
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="text" id="contact_phone" placeholder="+225 ...">
                </div>
                <button type="submit" class="btn-save">Enregistrer les modifications</button>
                <div id="success" class="success-msg">Réglages mis à jour avec succès !</div>
            </form>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://owkprsgfbxaxkijcomln.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM');

        async function initSettings() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.replace('login.html'); return; }
            document.getElementById('loader').style.display = 'none';

            // Charger les réglages actuels (on suppose qu'il n'y a qu'une seule ligne avec l'ID 1)
            const { data, error } = await _supabase.from('settings').select('*').single();
            
            if (data) {
                document.getElementById('site_name').value = data.site_name || '';
                document.getElementById('contact_email').value = data.contact_email || '';
                document.getElementById('contact_phone').value = data.contact_phone || '';
            }
        }

        document.getElementById('settingsForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Enregistrement...";
            
            const updates = {
                id: 1, // On met à jour la ligne 1
                site_name: document.getElementById('site_name').value,
                contact_email: document.getElementById('contact_email').value,
                contact_phone: document.getElementById('contact_phone').value,
                updated_at: new Date()
            };

            const { error } = await _supabase.from('settings').upsert(updates);

            if (error) {
                alert("Erreur lors de la mise à jour : " + error.message);
            } else {
                document.getElementById('success').style.display = 'block';
                setTimeout(() => document.getElementById('success').style.display = 'none', 3000);
            }
            btn.innerText = "Enregistrer les modifications";
        };

        window.onload = initSettings;
    </script>
</body>
</html>
