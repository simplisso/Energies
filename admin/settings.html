<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres Généraux | Admin SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary: #2D3748;
            --accent: #E53E3E;
            --bg-light: #F0F2F5;
            --white: #ffffff;
            --text-gray: #718096;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: #2D3748; }
        
        .admin-layout { display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background-color: var(--primary);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-menu a {
            display: block;
            padding: 12px 20px;
            color: #A0AEC0;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: rgba(255,255,255,0.05);
            color: white;
            border-left: 4px solid var(--accent);
        }
        .sidebar-menu i { margin-right: 10px; width: 20px; }

        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 30px; margin-left: 250px; }
        
        .settings-container {
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 800px;
        }

        .settings-section { margin-bottom: 40px; }
        .settings-section h2 { 
            font-size: 1.2rem; 
            margin-bottom: 20px; 
            padding-bottom: 10px; 
            border-bottom: 2px solid #F7FAFC;
            color: var(--primary);
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--text-gray); }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            font-family: inherit;
        }

        .btn-save {
            background: #38A169;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-save:hover { background: #2F855A; transform: translateY(-2px); }
        .btn-save:disabled { background: #A0AEC0; cursor: not-allowed; }

        .loading-overlay {
            display: none;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .admin-footer { margin-top: 40px; text-align: center; color: var(--text-gray); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-bolt" style="color:var(--accent)"></i> <span>SIMEL Admin</span></h2>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a>
                <a href="annonces-list.html"><i class="fas fa-list"></i> <span>Nos Services</span></a>
                <a href="leads.html"><i class="fas fa-envelope"></i> <span>Demandes</span></a>
                <a href="agents.html"><i class="fas fa-users"></i> <span>Agents</span></a>
                <a href="settings.html" class="active"><i class="fas fa-cog"></i> <span>Réglages</span></a>
                <hr style="margin: 20px; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> <span>Voir le site</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 style="margin-bottom: 30px;">Configuration du Site</h1>

            <div id="loader" class="loading-overlay">Chargement des paramètres...</div>

            <div class="settings-container">
                <form id="settingsForm">
                    <div class="settings-section">
                        <h2><i class="fas fa-id-card"></i> Coordonnées de contact</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Téléphone Officiel (WhatsApp)</label>
                                <input type="text" id="phone" required>
                            </div>
                            <div class="form-group">
                                <label>Email Officiel</label>
                                <input type="email" id="email" required>
                            </div>
                        </div>
                        <div class="form-group" style="margin-top:15px;">
                            <label>Adresse Physique</label>
                            <input type="text" id="address">
                        </div>
                    </div>

                    <div class="settings-section">
                        <h2><i class="fas fa-search"></i> Référencement (SEO)</h2>
                        <div class="form-group">
                            <label>Description du site (Meta Description)</label>
                            <textarea id="seo_description" rows="3"></textarea>
                        </div>
                    </div>

                    <button type="submit" id="saveBtn" class="btn-save">
                        <i class="fas fa-save"></i> Enregistrer les modifications
                    </button>
                </form>
            </div>

            <footer class="admin-footer">
                &copy; 2025 SIMEL S.E.S - Gestion Cloud Supabase.
            </footer>
        </main>
    </div>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_PcbOe0RSuZQffQ9zYhVO0w_xkuK44Nx';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('settingsForm');
        const loader = document.getElementById('loader');
        const saveBtn = document.getElementById('saveBtn');

        // 1. CHARGER LES DONNÉES DEPUIS SUPABASE
        async function loadSettings() {
            loader.style.display = 'block';
            const { data, error } = await _supabase
                .from('settings')
                .select('*')
                .eq('id', 1)
                .single();

            if (error) {
                console.error("Erreur de chargement:", error);
                alert("Impossible de charger les réglages.");
            } else if (data) {
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('seo_description').value = data.seo_description || '';
            }
            loader.style.display = 'none';
        }

        // 2. SAUVEGARDER LES MODIFICATIONS
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

            const updatedData = {
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                seo_description: document.getElementById('seo_description').value
            };

            const { error } = await _supabase
                .from('settings')
                .update(updatedData)
                .eq('id', 1);

            if (error) {
                alert("Erreur lors de la sauvegarde : " + error.message);
            } else {
                alert("Réglages mis à jour avec succès !");
            }

            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Enregistrer les modifications';
        });

        // 3. VÉRIFIER LA SESSION (SÉCURITÉ)
        async function checkAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                loadSettings();
            }
        }

        checkAuth();
    </script>

</body>
</html>
