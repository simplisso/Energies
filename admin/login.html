<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Sécurisée - SIMEL S.E.S</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #2D3748; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #4A5568; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 14px; background: #E53E3E; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: #E53E3E; margin-bottom: 15px; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 style="color: #2D3748;"><i class="fas fa-user-shield"></i> Admin</h1>
        <div id="errorMsg" class="error">Identifiants invalides</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Email Admin</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Se connecter</button>
        </form>
    </div>

    <script>
        // REMPLACEZ PAR VOS CLÉS SUPABASE
        const SUPABASE_URL = 'https://VOTRE_PROJET.supabase.co';
        const SUPABASE_KEY = 'VOTRE_CLE_ANON_PUBLIC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorDiv.innerText = "Erreur : " + error.message;
                errorDiv.style.display = 'block';
            } else {
                // Succès : Supabase garde la session dans le navigateur automatiquement
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
