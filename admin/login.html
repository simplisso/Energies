<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | SIMEL S.E.S</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #2D3748; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }

        .login-card h1 { color: #2D3748; margin-bottom: 5px; font-size: 1.6rem; }
        .login-card p { color: #718096; margin-bottom: 25px; font-size: 0.9rem; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #4A5568; font-size: 0.85rem; }
        .form-group input { 
            width: 100%; padding: 12px; border: 1px solid #E2E8F0; 
            border-radius: 6px; font-family: inherit; outline: none;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: #3182CE; }

        .login-btn { 
            width: 100%; padding: 12px; background: #3182CE; color: white; 
            border: none; border-radius: 6px; font-weight: bold; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .login-btn:hover { background: #2C5282; }
        .login-btn:disabled { background: #A0AEC0; cursor: not-allowed; }

        #error-msg { 
            color: #E53E3E; 
            font-size: 0.85rem; 
            margin-top: 15px; 
            background: #FFF5F5;
            padding: 10px;
            border-radius: 4px;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fas fa-lock" style="font-size: 2.5rem; color: #3182CE; margin-bottom: 15px;"></i>
        <h1>Admin SIMEL</h1>
        <p>Accès restreint aux administrateurs</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@simel-ses.com" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submitBtn" class="login-btn">Se connecter</button>
            <div id="error-msg"></div>
        </form>

        <a href="../index.html" style="display:inline-block; margin-top:20px; color:#718096; text-decoration:none; font-size:0.8rem;">
            <i class="fas fa-arrow-left"></i> Retour au site
        </a>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Utilise bien la ANON_KEY ici
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = "Connexion en cours...";

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMsg.innerText = "Erreur : " + error.message;
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = "Se connecter";
            } else {
                // Redirection immédiate vers le dashboard
                window.location.replace('dashboard.html');
            }
        });

        // Vérification automatique : si déjà connecté, on saute le login
        async function checkSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                window.location.replace('dashboard.html');
            }
        }
        window.onload = checkSession;
    </script>
</body>
</html>
