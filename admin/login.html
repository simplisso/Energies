<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin | SIMEL S.E.S</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #2D3748; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #E2E8F0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3182CE; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:disabled { background: #A0AEC0; }
        #error-msg { color: #E53E3E; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="color: #2D3748;">SIMEL Admin</h2>
        <p style="color: #718096; font-size: 0.9rem;">Entrez vos accès pour gérer le site</p>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <button type="submit" id="btnSubmit">Se connecter</button>
        </form>
        
        <div id="error-msg"></div>
        <a href="../index.html" style="display:block; margin-top:20px; font-size:0.8rem; color:#A0AEC0; text-decoration:none;">← Retour au site</a>
    </div>

    <script>
        // --- CONFIGURATION ---
        const _supabase = supabase.createClient('https://owkprsgfbxaxkijcomln.supabase.co', 'sb_publishable_PcbOe0RSuZQffQ9zYhVO0w_xkuK44Nx');

        const loginForm = document.getElementById('loginForm');
        const btnSubmit = document.getElementById('btnSubmit');
        const errorMsg = document.getElementById('error-msg');

        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Vérification...";
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 1. Tentative de connexion
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.innerText = "Identifiants invalides : " + error.message;
                errorMsg.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Se connecter";
            } else {
                // 2. IMPORTANT : On attend que Supabase confirme que la session est bien stockée
                // sur GitHub Pages, le stockage local peut prendre quelques millisecondes
                const { data: { session } } = await _supabase.auth.getSession();
                
                if (session) {
                    console.log("Session enregistrée avec succès");
                    // 3. Redirection vers le dashboard
                    window.location.replace('dashboard.html');
                } else {
                    errorMsg.innerText = "Erreur de synchronisation. Réessayez.";
                    errorMsg.style.display = 'block';
                    btnSubmit.disabled = false;
                }
            }
        };

        // Si l'utilisateur est déjà connecté, on l'envoie direct au dashboard
        async function checkStatus() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) window.location.replace('dashboard.html');
        }
        window.onload = checkStatus;
    </script>
</body>
</html>
