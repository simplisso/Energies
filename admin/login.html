<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> 
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2D3748; /* Couleur primaire SIMEL */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        .login-card h1 { 
            color: #2D3748; 
            margin-bottom: 30px; 
            font-size: 1.8rem;
        }
        .login-card h1 i {
            color: #E53E3E; /* Rouge accent SIMEL */
            margin-right: 10px;
        }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #4A5568;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #E2E8F0; 
            border-radius: 6px; 
            transition: 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #3182CE;
            outline: none;
        }
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: #E53E3E; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer; 
            transition: 0.3s; 
        }
        .login-btn:hover { 
            background: #C53030; 
            transform: translateY(-2px);
        }
        .back-site { 
            display: inline-block; 
            margin-top: 25px; 
            font-size: 0.9em; 
            color: #718096; 
            text-decoration: none;
        }
        .back-site:hover {
            color: #2D3748;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1><i class="fas fa-user-shield"></i> Espace Admin</h1>
        
        <form action="dashboard.html">
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" placeholder="Nom d'utilisateur" required>
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="login-btn">Se connecter</button>
        </form>

        <a href="../index.html" class="back-site">
            <i class="fas fa-arrow-left"></i> Retour au site public
        </a>
    </div>

</body>
</html>
