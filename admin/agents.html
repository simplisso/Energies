<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Agents | SIMEL Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #F0F2F5; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .main { margin-left: 280px; padding: 30px; width: calc(100% - 280px); }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #718096; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .agent-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; background: #E9D8FD; color: #553C9A; font-weight: 600; }
        
        #loader { position: fixed; inset: 0; background: #2D3748; color: white; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .btn-add { background: #3182CE; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loader">Chargement de l'équipe...</div>

    <nav class="sidebar">
        <h2>SIMEL Admin</h2>
        <ul style="list-style: none; padding: 0; margin-top: 30px;">
            <li><a href="dashboard.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Dashboard</a></li>
            <li><a href="annonces-list.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Expertises</a></li>
            <li><a href="leads.html" style="color:#A0AEC0; text-decoration: none; display:block; padding:10px 0;">Demandes</a></li>
            <li><a href="agents.html" style="color:white; text-decoration: none; display:block; padding:10px 0;"><b>Agents</b></a></li>
        </ul>
    </nav>

    <main class="main">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Équipe SIMEL S.E.S</h1>
            <a href="#" class="btn-add"><i class="fas fa-plus"></i> Ajouter un agent</a>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Nom & Prénom</th>
                        <th>Poste</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="agents-table">
                    <tr><td colspan="5">Récupération des agents...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // --- CONFIGURATION ---
        // Utilise bien la ANON KEY ici !
        const _supabase = supabase.createClient('https://VOTRE_PROJET.supabase.co', 'VOTRE_CLE_ANON_REEL');

        async function initAgents() {
            // Vérification Session
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
                return;
            }
            document.getElementById('loader').style.display = 'none';

            // Récupération des agents
            const { data: agents, error } = await _supabase
                .from('agents')
                .select('*')
                .order('name', { ascending: true });

            const table = document.getElementById('agents-table');
            
            if (error) {
                table.innerHTML = `<tr><td colspan="5" style="color:red;">Erreur : ${error.message}</td></tr>`;
                return;
            }

            if (agents.length === 0) {
                table.innerHTML = `<tr><td colspan="5">Aucun agent trouvé dans la base.</td></tr>`;
                return;
            }

            table.innerHTML = agents.map(agent => `
                <tr>
                    <td><img src="${agent.image_url || 'https://via.placeholder.com/150'}" class="agent-img"></td>
                    <td><b>${agent.name}</b></td>
                    <td><span class="badge">${agent.role || 'Agent'}</span></td>
                    <td>${agent.email || 'N/A'}</td>
                    <td>
                        <button onclick="deleteAgent('${agent.id}')" style="background:none; border:none; color:#E53E3E; cursor:pointer;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function deleteAgent(id) {
            if (confirm("Voulez-vous vraiment supprimer cet agent ?")) {
                const { error } = await _supabase.from('agents').delete().eq('id', id);
                if (error) alert("Erreur lors de la suppression");
                else location.reload();
            }
        }

        window.onload = initAgents;
    </script>
</body>
</html>
