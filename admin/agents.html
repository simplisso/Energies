<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Agents | SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        :root { --primary: #2D3748; --accent: #E53E3E; --bg: #F0F2F5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; }

        /* SIDEBAR identique aux autres pages */
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px 0; }
        .sidebar-menu a { display: block; padding: 12px 20px; color: #A0AEC0; text-decoration: none; }
        .sidebar-menu a.active { color: white; border-left: 4px solid var(--accent); background: rgba(255,255,255,0.05); }

        .main-content { flex: 1; margin-left: 250px; padding: 40px; }
        
        /* FORMULAIRE D'AJOUT */
        .agent-form { background: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-add { background: #38A169; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* LISTE DES AGENTS */
        .agent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .agent-card { background: white; padding: 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px; position: relative; }
        .agent-avatar { width: 50px; height: 50px; background: #E2E8F0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--primary); }
        .btn-del { position: absolute; top: 10px; right: 10px; color: #E53E3E; cursor: pointer; border: none; background: none; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="padding: 20px;"><h2>SIMEL Admin</h2></div>
        <nav class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a>
            <a href="agents.html" class="active"><i class="fas fa-users"></i> Agents</a>
            <a href="settings.html"><i class="fas fa-cog"></i> Réglages</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Gestion des Agents</h1>
        <p style="margin-bottom: 25px; color: #718096;">Ajoutez les membres de votre équipe technique.</p>

        <div class="agent-form">
            <h3>Nouvel Agent</h3>
            <form id="addAgentForm">
                <div class="form-grid" style="margin-top: 15px;">
                    <input type="text" id="name" placeholder="Nom Complet" required>
                    <input type="text" id="specialty" placeholder="Spécialité (ex: Solaire)" required>
                    <input type="tel" id="phone" placeholder="Téléphone">
                </div>
                <button type="submit" class="btn-add">Ajouter l'agent</button>
            </form>
        </div>

        <div id="agentList" class="agent-list">
            </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://VOTRE_PROJET.supabase.co';
        const SUPABASE_KEY = 'VOTRE_CLE_ANON_PUBLIC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Charger les agents
        async function loadAgents() {
            const { data: agents } = await _supabase.from('agents').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('agentList');
            list.innerHTML = agents.map(agent => `
                <div class="agent-card">
                    <div class="agent-avatar"><i class="fas fa-user"></i></div>
                    <div>
                        <strong>${agent.full_name}</strong>
                        <p style="font-size: 0.8rem; color: #718096;">${agent.specialty}</p>
                        <p style="font-size: 0.8rem;"><i class="fas fa-phone"></i> ${agent.phone || 'Non renseigné'}</p>
                    </div>
                    <button onclick="deleteAgent(${agent.id})" class="btn-del"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        // Ajouter un agent
        document.getElementById('addAgentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newAgent = {
                full_name: document.getElementById('name').value,
                specialty: document.getElementById('specialty').value,
                phone: document.getElementById('phone').value
            };

            const { error } = await _supabase.from('agents').insert([newAgent]);
            if (!error) {
                document.getElementById('addAgentForm').reset();
                loadAgents();
            }
        });

        // Supprimer
        async function deleteAgent(id) {
            if(confirm("Supprimer cet agent ?")) {
                await _supabase.from('agents').delete().eq('id', id);
                loadAgents();
            }
        }

        // Vérifier auth
        async function init() {
            const { data } = await _supabase.auth.getSession();
            if (!data.session) window.location.href = 'login.html';
            else loadAgents();
        }

        init();
    </script>
</body>
</html>
