<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Agents | Admin SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* ==================================== */
        /* CSS GLOBAL ADMIN (Ton Style)        */
        /* ==================================== */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; line-height: 1.6; color: #4A4A4A; background-color: #E2E8F0; }
        a { text-decoration: none; transition: 0.3s; }
        
        .admin-layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 250px;
            background-color: #2D3748;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            padding: 0 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .sidebar-menu a {
            display: block;
            padding: 12px 20px;
            color: #A0AEC0;
            font-size: 0.95rem;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: rgba(255,255,255,0.05);
            color: white;
            border-left: 4px solid #E53E3E;
        }

        .main-content { flex: 1; margin-left: 250px; padding: 30px; }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .agent-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .agent-avatar {
            width: 60px;
            height: 60px;
            background: #EDF2F7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #3182CE;
        }

        .agent-info h3 { font-size: 1.1rem; color: #2D3748; }
        .role-tag {
            display: inline-block;
            background: #EBF8FF;
            color: #2B6CB0;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .agent-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #E53E3E;
            cursor: pointer;
            opacity: 0.6;
        }
        .agent-actions:hover { opacity: 1; }

        .admin-footer { margin-top: 50px; text-align: center; color: #718096; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-bolt" style="color:#E53E3E"></i> <span>SIMEL Admin</span></h2>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="annonces-list.html"><i class="fas fa-list"></i> Nos Services</a>
                <a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a>
                <a href="agents.html" class="active"><i class="fas fa-users"></i> Agents</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Réglages</a>
            </nav>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>Équipe Technique</h1>
                <button onclick="addAgent()" style="background:#3182CE; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:600;">
                    <i class="fas fa-plus"></i> Ajouter un Agent
                </button>
            </div>

            <div class="agents-grid" id="agents-list">
                <p>Chargement des agents...</p>
            </div>

            <footer class="admin-footer">
                &copy; 2025 SIMEL S.E.S - Gestion des ressources humaines techniques.
            </footer>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAgents() {
            const { data, error } = await _supabase.from('agents').select('*').order('name');
            if (error) return;

            const list = document.getElementById('agents-list');
            list.innerHTML = '';

            data.forEach(agent => {
                // Choisir l'icône selon le rôle
                let icon = 'fa-user-cog';
                if(agent.role.toLowerCase().includes('clim')) icon = 'fa-snowflake';
                if(agent.role.toLowerCase().includes('solair')) icon = 'fa-sun';

                list.innerHTML += `
                    <div class="agent-card">
                        <div class="agent-avatar"><i class="fas ${icon}"></i></div>
                        <div class="agent-info">
                            <span class="role-tag">${agent.role}</span>
                            <h3>${agent.name}</h3>
                            <p><i class="fas fa-phone" style="font-size: 0.8em;"></i> ${agent.phone}</p>
                        </div>
                        <div class="agent-actions" onclick="deleteAgent('${agent.id}')">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                    </div>
                `;
            });
        }

        async function addAgent() {
            const name = prompt("Nom de l'agent :");
            const role = prompt("Rôle (ex: Installateur Solaire, Frigoriste) :");
            const phone = prompt("Téléphone :");

            if (name && role && phone) {
                await _supabase.from('agents').insert([{ name, role, phone }]);
                loadAgents();
            }
        }

        async function deleteAgent(id) {
            if(confirm("Supprimer cet agent ?")) {
                await _supabase.from('agents').delete().eq('id', id);
                loadAgents();
            }
        }

        window.onload = loadAgents;
    </script>
</body>
</html>
