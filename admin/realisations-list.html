<!DOCTYPE html>
<html lang="fr" data-admin-page>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Réalisations | Admin SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; line-height: 1.6; color: #4A4A4A; background-color: #E2E8F0; }
        
        /* Layout */
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background-color: #2D3748; color: white; padding: 20px 0; position: fixed; height: 100vh; }
        .sidebar-header { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar-menu a { display: block; padding: 12px 20px; color: #A0AEC0; text-decoration: none;}
        .sidebar-menu a:hover, .sidebar-menu a.active { background-color: rgba(255,255,255,0.05); color: white; border-left: 4px solid #E53E3E; }
        .main-content { flex: 1; margin-left: 250px; padding: 30px; }

        /* Formulaire */
        .form-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 5px; font-family: inherit; }
        .btn-save { background-color: #38A169; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .form-actions { display: flex; gap: 10px; margin-top: 12px; }
        .form-actions button { flex: 1; }
        .btn-cancel { background: #718096; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .image-help { margin: 8px 0 14px; color: #718096; font-size: 0.85rem; }
        .edit-image-preview { width: 110px; height: 72px; object-fit: cover; border-radius: 6px; margin: 8px 0; }
        .table-actions { display: flex; gap: 8px; }
        .btn-edit, .btn-delete { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 7px 10px; border-radius: 5px; cursor: pointer; }
        .btn-edit { color: #2b6cb0; border: 1px solid #90cdf4; background: #ebf8ff; }
        .btn-delete { color: #c53030; border: 1px solid #feb2b2; background: #fff5f5; font-size: 0.9rem; }
        
        /* Table */
        .admin-table-container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        .admin-table { width: 100%; min-width: 560px; border-collapse: collapse; }
        .admin-table th { text-align: left; padding: 15px; border-bottom: 2px solid #edf2f7; color: #718096; font-size: 0.8rem; }
        .admin-table td { padding: 15px; border-bottom: 1px solid #edf2f7; }
        .thumb { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; }
        .btn-delete { color: #E53E3E; border:none; background:none; cursor:pointer; font-size: 1.1rem; }
        @media (max-width: 560px) {
            .main-content { padding: 20px 14px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .admin-table-container { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2><i class="fas fa-bolt" style="color:#E53E3E"></i> SIMEL Admin</h2></div>
            <nav class="sidebar-menu">
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="realisations-list.html" class="active"><i class="fas fa-images"></i> Réalisations</a>
                <a href="leads.html"><i class="fas fa-envelope"></i> Demandes</a>
                <a href="agents.html"><i class="fas fa-users"></i> Agents</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Réglages</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Gestion des Réalisations</h1>
            <p style="margin-bottom: 20px;">Ajoutez vos chantiers et photos directement ici.</p>

            <div class="form-container">
                <form id="add-project-form">
                    <div class="form-grid">
                        <input type="text" id="p-title" placeholder="Titre du projet (ex: Installation 5kW)" required>
                        <select id="p-category">
                            <option value="Solaire">Solaire</option>
                            <option value="Électricité">Électricité</option>
                            <option value="Froid">Froid</option>
                            <option value="Sécurité">Sécurité</option>
                        </select>
                        <input type="text" id="p-location" placeholder="Ville (ex: Cotonou)" required>
                        <input type="file" id="p-image" accept="image/*">
                    </div>
                    <p id="image-help" class="image-help">Une image est nécessaire pour une nouvelle réalisation.</p>
                    <img id="edit-image-preview" class="edit-image-preview" alt="Photo actuelle" hidden>
                    <textarea id="p-desc" placeholder="Courte description du travail effectué" rows="2"></textarea>
                    <div class="form-actions">
                        <button type="submit" class="btn-save" id="btn-submit"><i class="fas fa-upload"></i> Ajouter la réalisation</button>
                        <button type="button" class="btn-cancel" id="cancel-edit" hidden>Annuler la modification</button>
                    </div>
                </form>
            </div>

            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Titre</th>
                            <th>Lieu</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="services-tbody">
                        <tr><td colspan="4">Chargement des données...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const _supabase = window.adminSupabase;

        const form = document.getElementById('add-project-form');
        const btnSubmit = document.getElementById('btn-submit');
        const imageInput = document.getElementById('p-image');
        const imagePreview = document.getElementById('edit-image-preview');
        const imageHelp = document.getElementById('image-help');
        const cancelEditButton = document.getElementById('cancel-edit');
        const tbody = document.getElementById('services-tbody');
        let services = [];
        let editingId = null;
        let currentImageUrl = '';

        async function loadServices() {
            const { data, error } = await _supabase
                .from('portfolio_services')
                .select('id, title, category, location, description, image_url, created_at')
                .order('created_at', { ascending: false });

            tbody.replaceChildren();
            if (error) {
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 4;
                cell.textContent = 'Impossible de charger les réalisations.';
                console.error('Erreur de chargement des réalisations:', error);
                return;
            }

            services = data || [];
            if (services.length === 0) {
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 4;
                cell.textContent = 'Aucune réalisation pour le moment.';
                return;
            }

            services.forEach(item => {
                const row = tbody.insertRow();
                const imageCell = row.insertCell();
                if (item.image_url) {
                    const image = document.createElement('img');
                    image.src = item.image_url;
                    image.alt = item.title ? `Photo de ${item.title}` : 'Réalisation SIMEL';
                    image.className = 'thumb';
                    image.addEventListener('error', () => {
                        image.replaceWith(document.createTextNode('Aucune image'));
                    }, { once: true });
                    imageCell.appendChild(image);
                } else {
                    imageCell.textContent = 'Aucune image';
                }

                const titleCell = row.insertCell();
                const title = document.createElement('strong');
                title.textContent = item.title || 'Sans titre';
                const category = document.createElement('small');
                category.textContent = item.category || 'Réalisation';
                titleCell.append(title, document.createElement('br'), category);
                row.insertCell().textContent = item.location || '—';

                const actionsCell = row.insertCell();
                const actions = document.createElement('div');
                actions.className = 'table-actions';
                const editButton = document.createElement('button');
                editButton.type = 'button';
                editButton.className = 'btn-edit';
                editButton.dataset.action = 'edit';
                editButton.dataset.id = item.id;
                editButton.setAttribute('aria-label', `Modifier ${item.title || 'la réalisation'}`);
                editButton.innerHTML = '<i class="fas fa-pen" aria-hidden="true"></i><span>Modifier</span>';
                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'btn-delete';
                deleteButton.dataset.action = 'delete';
                deleteButton.dataset.id = item.id;
                deleteButton.setAttribute('aria-label', `Supprimer ${item.title || 'la réalisation'}`);
                deleteButton.innerHTML = '<i class="fas fa-trash-alt" aria-hidden="true"></i><span>Supprimer</span>';
                actions.append(editButton, deleteButton);
                actionsCell.appendChild(actions);
            });
        }

        function startEditing(id) {
            const item = services.find(service => String(service.id) === id);
            if (!item) return;

            editingId = id;
            currentImageUrl = item.image_url || '';
            document.getElementById('p-title').value = item.title || '';
            document.getElementById('p-category').value = item.category || 'Solaire';
            document.getElementById('p-location').value = item.location || '';
            document.getElementById('p-desc').value = item.description || '';
            imageInput.value = '';
            imagePreview.hidden = !currentImageUrl;
            imagePreview.src = currentImageUrl;
            imageHelp.textContent = currentImageUrl
                ? 'Choisissez une nouvelle image uniquement si vous souhaitez remplacer la photo actuelle.'
                : 'Cette réalisation n’a pas encore de photo. Vous pouvez en ajouter une maintenant.';
            btnSubmit.innerHTML = '<i class="fas fa-save" aria-hidden="true"></i> Enregistrer les modifications';
            cancelEditButton.hidden = false;
            form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function cancelEditing() {
            editingId = null;
            currentImageUrl = '';
            form.reset();
            imagePreview.removeAttribute('src');
            imagePreview.hidden = true;
            imageHelp.textContent = 'Une image est nécessaire pour une nouvelle réalisation.';
            btnSubmit.innerHTML = '<i class="fas fa-upload" aria-hidden="true"></i> Ajouter la réalisation';
            cancelEditButton.hidden = true;
        }

        async function uploadImage(file) {
            const safeName = file.name.replace(/[^A-Za-z0-9._-]/g, '_') || 'realisation';
            const fileName = `${Date.now()}_${safeName}`;
            const { error } = await _supabase.storage
                .from('realisations')
                .upload(fileName, file);

            if (error) throw error;
            return _supabase.storage.from('realisations').getPublicUrl(fileName).data.publicUrl;
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const file = imageInput.files[0];
            if (!editingId && !file) {
                alert('Ajoutez une photo pour cette nouvelle réalisation.');
                imageInput.focus();
                return;
            }

            btnSubmit.disabled = true;
            try {
                btnSubmit.textContent = file ? 'Téléversement de la photo…' : 'Enregistrement…';
                const imageUrl = file ? await uploadImage(file) : currentImageUrl;
                const project = {
                    title: document.getElementById('p-title').value.trim(),
                    category: document.getElementById('p-category').value,
                    location: document.getElementById('p-location').value.trim(),
                    description: document.getElementById('p-desc').value.trim(),
                    image_url: imageUrl
                };

                const result = editingId
                    ? await _supabase.from('portfolio_services').update(project).eq('id', editingId)
                    : await _supabase.from('portfolio_services').insert([project]);

                if (result.error) throw result.error;
                alert(editingId ? 'Réalisation mise à jour.' : 'Réalisation ajoutée.');
                cancelEditing();
                await loadServices();
            } catch (error) {
                alert('Impossible d’enregistrer la réalisation. Vérifiez les champs et réessayez.');
                console.error('Erreur d’enregistrement de la réalisation:', error);
            } finally {
                btnSubmit.disabled = false;
                if (editingId) {
                    btnSubmit.innerHTML = '<i class="fas fa-save" aria-hidden="true"></i> Enregistrer les modifications';
                } else {
                    btnSubmit.innerHTML = '<i class="fas fa-upload" aria-hidden="true"></i> Ajouter la réalisation';
                }
            }
        });

        cancelEditButton.addEventListener('click', cancelEditing);
        tbody.addEventListener('click', async event => {
            const button = event.target.closest('[data-action][data-id]');
            if (!button) return;

            if (button.dataset.action === 'edit') {
                startEditing(button.dataset.id);
                return;
            }

            if (button.dataset.action === 'delete' && confirm('Voulez-vous supprimer cette réalisation ?')) {
                const { error } = await _supabase.from('portfolio_services').delete().eq('id', button.dataset.id);
                if (error) {
                    alert('Impossible de supprimer cette réalisation.');
                    console.error('Erreur de suppression:', error);
                    return;
                }
                if (editingId === button.dataset.id) cancelEditing();
                await loadServices();
            }
        });

        window.onload = async () => {
            if (await window.adminReady) loadServices();
        };
    </script>
</body>
</html>
