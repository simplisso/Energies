<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gérer les Réalisations | Admin SIMEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; margin: 0; display: flex; }
        .sidebar { width: 250px; background: #2D3748; color: white; height: 100vh; position: fixed; padding: 20px; }
        .sidebar a { display: block; color: #A0AEC0; padding: 12px; text-decoration: none; margin-bottom: 5px; border-radius: 5px; }
        .sidebar a.active { background: #E53E3E; color: white; }
        
        .main-content { margin-left: 250px; padding: 40px; width: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-info h3 { margin: 0; font-size: 1.1rem; }
        .btn-add { background: #3182CE; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: rgba(229, 62, 62, 0.9); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>SIMEL Admin</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="realisations-list.html" class="active">Réalisations</a>
        <a href="leads.html">Demandes</a>
        <a href="agents.html">Agents</a>
        <a href="settings.html">Réglages</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Nos Réalisations</h1>
            <button class="btn-add" onclick="addProject()"><i class="fas fa-plus"></i> Nouveau Projet</button>
        </div>

        <div class="project-grid" id="projectList">
            </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadProjects() {
            const { data, error } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('projectList');
            container.innerHTML = '';

            data.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <button class="btn-delete" onclick="deleteProject('${p.id}')"><i class="fas fa-trash"></i></button>
                        <img src="${p.image_url || 'https://via.placeholder.com/400x250'}" alt="">
                        <div class="card-info">
                            <h3>${p.title}</h3>
                            <p style="color: #718096; font-size: 0.8rem;"><i class="fas fa-map-marker-alt"></i> ${p.location}</p>
                        </div>
                    </div>
                `;
            });
        }

        async function addProject() {
            const title = prompt("Nom du projet (ex: Installation Solaire 5kW) :");
            const location = prompt("Ville (ex: Cotonou, Calavi) :");
            const category = prompt("Catégorie (Solaire, Électricité, Froid) :");
            const image_url = prompt("URL de l'image (Lien vers la photo) :");

            if (title && location) {
                const { error } = await _supabase.from('projects').insert([{ title, location, category, image_url }]);
                if (error) alert(error.message);
                else loadProjects();
            }
        }

        async function deleteProject(id) {
            if (confirm("Supprimer cette réalisation ?")) {
                await _supabase.from('projects').delete().eq('id', id);
                loadProjects();
            }
        }

        window.onload = loadProjects;
    </script>
</body>
</html>
