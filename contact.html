<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SIMEL S.E.S</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2D3748; --accent: #E53E3E; --white: #ffffff; }
        .contact-container { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; margin-top: 40px; }
        .info-box { background: var(--white); padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .info-item { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 25px; }
        .info-item i { color: var(--accent); font-size: 1.2rem; margin-top: 5px; }
        .contact-form { background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; 
        }
        .submit-btn { 
            background: var(--accent); color: white; border: none; padding: 15px 30px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s;
        }
        .submit-btn:hover { background: #c53030; }
        @media (max-width: 768px) { .contact-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="header-top">
                <a href="index.html" class="logo"><i class="fas fa-bolt" style="color: var(--accent);"></i> SIMEL S.E.S</a>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 40px 0;">
        <div class="contact-container">
            <aside class="info-box">
                <h2 style="margin-bottom: 20px;">Nos Coordonnées</h2>
                <div class="info-item"><i class="fas fa-phone-alt"></i><div><strong>Téléphone</strong><p class="dyn-phone">Chargement...</p></div></div>
                <div class="info-item"><i class="fas fa-envelope"></i><div><strong>Email</strong><p class="dyn-email">Chargement...</p></div></div>
            </aside>

            <section class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label>Nom Complet</label>
                        <input type="text" id="client_name" placeholder="Ex: Jean Dupont" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="client_email" placeholder="votre@email.com" required>
                        </div>
                        <div class="form-group">
                            <label>Téléphone</label>
                            <input type="tel" id="client_phone" placeholder="+229..." required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Service souhaité</label>
                        <select id="subject" required>
                            <option value="">Sélectionnez un domaine</option>
                            <option value="Solaire">Énergie Solaire</option>
                            <option value="Electricité">Électricité Industrielle</option>
                            <option value="Sécurité">Sécurité Électronique</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Votre Message</label>
                        <textarea id="message" rows="5" placeholder="Décrivez votre besoin..." required></textarea>
                    </div>
                    <button type="submit" id="submitBtn" class="submit-btn">Envoyer ma demande</button>
                </form>
            </section>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://owkprsgfbxaxkijcomln.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93a3Byc2dmYnhheGtpamNvbWxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MzI1NjQsImV4cCI6MjA4MjEwODU2NH0.RvVHppQWTDqEFfBLrHJxSdC5cvb5BwuulpAxDi4TndM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Sync des infos depuis settings
        async function syncContactInfo() {
            const { data } = await _supabase.from('settings').select('*').limit(1).single();
            if (data) {
                document.querySelectorAll('.dyn-phone').forEach(el => el.textContent = data.phone);
                document.querySelectorAll('.dyn-email').forEach(el => el.textContent = data.email);
            }
        }

        // Envoi du formulaire
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Envoi en cours...";

            // On envoie les données avec les nouveaux noms de colonnes
            const { error } = await _supabase.from('leads').insert([{
                client_name: document.getElementById('client_name').value,
                client_email: document.getElementById('client_email').value, // Ajout de l'email
                client_phone: document.getElementById('client_phone').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            }]);

            if (!error) {
                alert("Message envoyé avec succès !");
                e.target.reset();
            } else {
                alert("Erreur : " + error.message);
            }
            btn.disabled = false;
            btn.innerText = "Envoyer ma demande";
        });

        window.onload = syncContactInfo;
    </script>
</body>
</html>
