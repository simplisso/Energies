<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMEL S.E.S - Énergie Solaire & Électricité</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">SIMEL <span>S.E.S</span></div>
        <ul class="nav-links">
            <li><a href="#accueil">Accueil</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
            <li><a href="admin/login.html" class="admin-link"><i class="fas fa-user-lock"></i></a></li>
        </ul>
    </nav>

    <header id="accueil" class="hero">
        <div class="hero-content">
            <h1>L'énergie de demain, dès aujourd'hui.</h1>
            <p>Solutions photovoltaïques et expertise électrique au Bénin.</p>
            <a href="#contact" class="btn-primary">Demander un devis</a>
        </div>
    </header>

    <section id="services" class="services">
        <div class="container">
            <h2>Nos Services</h2>
            <div class="services-grid" id="services-container">
                </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>Contactez-nous</h2>
            <div class="contact-flex">
                <div class="contact-info">
                    <p><i class="fas fa-phone"></i> <span id="display-phone">Chargement...</span></p>
                    <p><i class="fas fa-envelope"></i> <span id="display-email">Chargement...</span></p>
                    <p><i class="fas fa-map-marker-alt"></i> <span id="display-address">Cotonou, Bénin</span></p>
                </div>

                <form id="contactForm">
                    <input type="text" id="client_name" placeholder="Nom" required>
                    <input type="text" id="client_phone" placeholder="Téléphone" required>
                    <textarea id="message" placeholder="Votre message" required></textarea>
                    <button type="submit" id="submitBtn" class="btn-primary">Envoyer</button>
                    <div id="formStatus" style="margin-top:10px;"></div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 SIMEL S.E.S</p>
    </footer>

    <script>
        // CONFIGURATION SUPABASE
        const SUPABASE_URL = 'https://VOTRE_PROJET.supabase.co';
        const SUPABASE_KEY = 'VOTRE_CLE_ANON_PUBLIC';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Charger les infos de contact
        async function loadSettings() {
            const { data } = await _supabase.from('settings').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('display-phone').innerText = data.phone;
                document.getElementById('display-email').innerText = data.email;
            }
        }

        // 2. Charger les services (avec tes photos)
        async function loadServices() {
            const { data } = await _supabase.from('portfolio_services').select('*');
            const container = document.getElementById('services-container');
            if (data && data.length > 0) {
                container.innerHTML = data.map(s => `
                    <div class="service-card">
                        <img src="${s.image_url}" alt="${s.title}" style="width:100%; border-radius:8px;">
                        <h3>${s.title}</h3>
                        <p>${s.description}</p>
                    </div>
                `).join('');
            }
        }

        // 3. Envoyer le formulaire
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Envoi...";
            
            const { error } = await _supabase.from('leads').insert([{
                client_name: document.getElementById('client_name').value,
                client_phone: document.getElementById('client_phone').value,
                message: document.getElementById('message').value,
                subject: "Demande via site",
                status: "nouveau"
            }]);

            if (!error) {
                document.getElementById('formStatus').innerText = "Message envoyé !";
                e.target.reset();
                btn.innerText = "Envoyer";
            }
        });

        loadSettings();
        loadServices();
    </script>
</body>
</html>
